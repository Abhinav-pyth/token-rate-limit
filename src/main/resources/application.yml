server:
  # PORT env var is injected by container platforms (Vercel/Railway/Fly/Render); falls back to 8080
  port: ${PORT:8080}

spring:
  application:
    name: rate-limit-token-bucket

# Token-bucket rate limiting settings (bound to RateLimitProperties)
rate-limit:
  enabled: true
  capacity: 5                  # max burst: bucket holds up to 5 tokens
  refill-tokens-per-second: 1  # sustained rate: 1 token is added every second

logging:
  level:
    com.example.ratelimit: INFO
